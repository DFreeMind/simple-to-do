name: 发布桌面应用

on:
  workflow_dispatch:
    inputs:
      version:
        description: '本次发布的应用版本，必须与 package.json 和 tauri.conf.json 完全一致'
        required: true
        type: string
      release_notes:
        description: '中文 Release Notes（包含主要更新、修复和已知限制）'
        required: true
        type: string

jobs:
  release-windows:
    name: 构建并发布 Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 发布前校验
        run: npm run release:check -- ${{ inputs.version }}

      - name: 构建并上传 Release 资源
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: ${{ inputs.release_notes }}
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: simple-to-do_[version]_[arch][setup].[ext]

      - name: 修复 latest.json 更新说明编码
        run: node scripts/fix-updater-json.mjs --tag v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置部署私钥
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'deploy_key'
          [System.IO.File]::WriteAllText($keyPath, $env:DEPLOY_SSH_KEY)
          Write-Output "DEPLOY_KEY_FILE=$keyPath" >> $env:GITHUB_ENV

      - name: 同步更新源到自建服务器
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-update-source.mjs --version ${{ inputs.version }} --base-url https://simpletodo.duqimeng.cn

  release-macos:
    name: 追加 macOS 资产
    needs: release-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm ci

      - name: 发布前校验
        run: npm run release:check -- ${{ inputs.version }}

      - name: 构建并追加 macOS Release 资源
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: __VERSION__
          releaseBody: ${{ inputs.release_notes }}
          releaseDraft: false
          prerelease: false
          args: --bundles dmg
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: simple-to-do_[version]_[arch].[ext]

      - name: 修复 latest.json 更新说明编码
        run: node scripts/fix-updater-json.mjs --tag v${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
